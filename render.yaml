services:
  - type: web
    name: cropsense-api
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # diisi manual di Render dashboard (sensitive)
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: ALLOWED_ORIGINS
        sync: false          # diisi setelah dapat URL Vercel
      - key: PYTHON_VERSION
        value: "3.11"
